name: Mutation Testing CI Gate

on:
  pull_request:
  push:
    branches: [area1/ashar]

jobs:
  mutation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mutmut coverage pytest

      - name: Run mutation testing
        run: |
          mutmut run --paths-to-mutate hc/api/ hc/accounts/ hc/front/
          mutmut results --json > mutmut-results.json

      - name: Check mutation score
        run: |
          SURVIVING=$(mutmut results --json | python -c "import sys,json; d=json.load(sys.stdin); print(len(d['surviving']))")
          TOTAL=$(mutmut results --json | python -c "import sys,json; d=json.load(sys.stdin); print(len(d['killed'])+len(d['surviving']))")
          SCORE=$((100 * TOTAL / SURVIVING))
          echo "Mutation score: ${SCORE}%"
          if [ "$SCORE" -lt 80 ]; then
            echo "::error ::Mutation score below 80% threshold"
            exit 1
          fi