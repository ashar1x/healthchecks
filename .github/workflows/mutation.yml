name: Mutation Testing

on:
  pull_request:
    branches: [master, area1/ashar]
    paths:
      - 'hc/**'
      - 'tests/team/**'
      - 'setup.cfg'
      - 'pytest.ini'
      - '.github/workflows/mutation.yml'
  push:
    branches: [master, area1/ashar]
    paths:
      - 'hc/**'
      - 'tests/team/**'
      - 'setup.cfg'
      - 'pytest.ini'
      - '.github/workflows/mutation.yml'

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation Testing (80% gate)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pip install mutmut pytest pytest-django
          pip uninstall -y pytest-randomly

      - name: Run mutation testing
        run: mutmut run

      - name: Mutation results
        run: mutmut results

      - name: Export CI/CD stats
        run: mutmut export-cicd-stats

      - name: Mutation score gate (threshold 80%)
        run: python tools/mutation/score_gate.py