[mutmut]
# Phase 8 mutation testing (mutmut 3.x).
#
# The whole hc/ package is copied into mutants/ so the mutated code can be
# imported by the tests (Django settings, URLconf, models).  Mutation is then
# restricted to the two files measured in Phase 5 (see .coveragerc and
# docs/08-unit-testing.md):
#   hc/api/models.py      Check.get_status / get_grace_start / ping / pause /
#                         resume and the state-transition rules (BR-01..BR-03)
#   hc/api/decorators.py  API key and role checks (BR-04)
#
# NOTE: mutmut 3.x reads list options from setup.cfg as one value per line.
source_paths = hc/

only_mutate =
    hc/api/models.py
    hc/api/decorators.py

# Mutate only lines exercised by tests/team/.  The rest of models.py is out of
# the Phase 5 measurement scope and is defended line-by-line in docs/08 §5.
mutate_only_covered_lines = true

# Team test suite (Phase 5-7).  tests_dir is deprecated in mutmut 3.x.
pytest_add_cli_args_test_selection = tests/team/

# Files mutmut must copy into mutants/ for pytest-django to start and for the
# MCC test to load its truth table (REPO_ROOT/evidence/raw/*.csv).
# manage.py is essential: pytest-django walks up from mutants/ looking for a
# Django project and would otherwise insert the ORIGINAL repo root at
# sys.path[0], making the tests import unmutated code (0 mutants covered).
# CHANGELOG.md is read by hc/settings.py at import time.
also_copy =
    pytest.ini
    manage.py
    CHANGELOG.md
    templates/
    evidence/raw
