# SonarQube scan configuration — SQE final project, area 1 (Ashar Ahmed).
# Backend (Python) + frontend (JavaScript) only, per the master prompt Phase 3.
# Exclusions are deliberate and documented in docs/02-static-analysis.md:
#  - hc/**/tests/**       upstream test suite (earns no marks, never copied; would
#                         distort duplication and code-smell counts)
#  - static/js/*.min.js   third-party minified libraries (vendor code)
#  - static/js/webauthn-json.browser-global.js, static/js/zxcvbn.min.js
#                         vendored non-minified third-party libraries
# After Phase 5, add: sonar.python.coverage.reportPaths=coverage.xml
sonar.projectKey=sqe-healthchecks
sonar.projectName=healthchecks-sqe
sonar.sourceEncoding=UTF-8
sonar.sources=hc,static/js
sonar.exclusions=hc/**/tests/**,static/js/*.min.js,static/js/webauthn-json.browser-global.js,static/js/zxcvbn.min.js
sonar.python.version=3.12
